# Tmux Configuration — DevOS
# Catppuccin Mocha theme

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Use Ctrl-a as prefix (screen style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar
set -g status-position top
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left-length 32
set -g status-right-length 64
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S "
set -g status-right "#[fg=#cdd6f4,bg=#313244] %Y-%m-%d %H:%M "

setw -g window-status-format "#[fg=#585b70,bg=#1e1e2e] #I #W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W "

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

# Larger history
set -g history-limit 50000

# Faster escape time
set -sg escape-time 0

# Focus events
set -g focus-events on
