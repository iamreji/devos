name: YAML Lint
on:
  push:
    paths: ['**.yml', '**.yaml']
  pull_request:
    paths: ['**.yml', '**.yaml']

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          format: standard
